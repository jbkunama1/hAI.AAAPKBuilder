name: Import upstream and publish GHCR
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Import complete pinned upstream when missing
        shell: bash
        env:
          UPSTREAM_SHA: 9b83522e57ee35eadb9e779dcdf19a7266751ae1
        run: |
          set -euo pipefail
          if [ ! -f upstream/server.js ]; then
            mkdir -p upstream
            curl --fail --location --retry 3 "https://codeload.github.com/malebuffy/AndroidAutoMaker/tar.gz/$UPSTREAM_SHA" -o /tmp/upstream.tar.gz
            tar -xzf /tmp/upstream.tar.gz --strip-components=1 -C upstream
            test -s upstream/LICENSE
            cp upstream/LICENSE LICENSE
            printf '%s\n' "Source: https://github.com/malebuffy/AndroidAutoMaker" "Commit: $UPSTREAM_SHA" 'License: GPL-3.0-only; retain upstream notices and third-party licenses.' > UPSTREAM.txt
            if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.ref }}" = refs/heads/main ]; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add upstream LICENSE UPSTREAM.txt
              git commit -m "chore: vendor AndroidAutoMaker at $UPSTREAM_SHA with original license"
              git push origin HEAD:main
            fi
          fi
          test -s LICENSE
          test -s upstream/tools/apktool.jar
      - name: Set image name and source revision
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=sha-${{ steps.vars.outputs.revision }}
      - name: Build local image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: aaapkbuilder:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test authentication health and toolchain
        run: bash scripts/smoke.sh aaapkbuilder:test
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/jbkunama1/hAI.AAAPKBuilder
            org.opencontainers.image.revision=${{ steps.vars.outputs.revision }}
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha
